[project]
name = "jules-ai-api"
version = "0.1.0"
description = "Organization-aware Google ADK chat API for Jules AI"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "firebase-admin>=6.6.0",
  "google-adk>=2.0.0,<3.0.0",
  "google-cloud-storage>=2.19.0",
  "google-cloud-documentai>=3.6.0",
  "httpx>=0.28.0",
  "matplotlib>=3.9.0",
  "openpyxl>=3.1.5",
  "pillow>=11.0.0",
  "pgvector>=0.3.6",
  "pypdf>=5.4.0",
  "pydantic-settings>=2.7.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.20",
  "python-pptx>=1.0.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
